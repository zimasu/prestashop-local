version: '3'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    volumes:
      - mysql_data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:9.1.0-apache
    depends_on:
      - mysql
    ports:
      - "8080:80"
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: bath-excluding-yearly.ngrok-free.dev
      ADMIN_MAIL: admin@demo.com
      ADMIN_PASSWD: admin1234!
      PS_ADMIN_DIRECTORY: admin
    volumes:
      - prestashop_data:/var/www/html

volumes:
  mysql_data:
  prestashop_data: